# Push to main -> build and deploy on our own server (no Vercel). The SSH key in DEPLOY_SSH_KEY can only run the
# server's deploy script for one commit sha of this public repo; it has no shell. See ~/bin/portfolio-deploy.sh on the server.
name: Deploy to server
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-server
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy this commit
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=20 ubuntu@"$HOST" "$GITHUB_SHA"
      - name: Check the live site
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://app.leslieajayi.com/ || true)
            echo "attempt $i: $code"; [ "$code" = "200" ] && exit 0; sleep 6
          done
          exit 1
